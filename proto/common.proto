syntax = "proto3";

package zenc.protocol;

option go_package = "github.com/aminofox/zenc-protocol/go/protocol";

// Common enums and types used across all protocol messages

// RoomRole defines the role of a participant in a room
enum RoomRole {
  ROOM_ROLE_UNSPECIFIED = 0;
  ROOM_ROLE_PUBLISHER = 1;
  ROOM_ROLE_SUBSCRIBER = 2;
  ROOM_ROLE_MODERATOR = 3;
}

// TrackKind defines the type of media track
enum TrackKind {
  TRACK_KIND_UNSPECIFIED = 0;
  TRACK_KIND_AUDIO = 1;
  TRACK_KIND_VIDEO = 2;
}

// TrackSource defines the source of a media track
enum TrackSource {
  TRACK_SOURCE_UNSPECIFIED = 0;
  TRACK_SOURCE_CAMERA = 1;
  TRACK_SOURCE_SCREEN = 2;
  TRACK_SOURCE_MICROPHONE = 3;
}

// TrackStatus defines the status of a track
enum TrackStatus {
  TRACK_STATUS_UNSPECIFIED = 0;
  TRACK_STATUS_ACTIVE = 1;
  TRACK_STATUS_PAUSED = 2;
  TRACK_STATUS_STOPPED = 3;
}

// ConnectionState defines the state of a connection
enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_STATE_DISCONNECTED = 1;
  CONNECTION_STATE_CONNECTING = 2;
  CONNECTION_STATE_CONNECTED = 3;
  CONNECTION_STATE_RECONNECTING = 4;
  CONNECTION_STATE_FAILED = 5;
}

// ConnectionQuality defines the quality of a connection
enum ConnectionQuality {
  CONNECTION_QUALITY_UNSPECIFIED = 0;
  CONNECTION_QUALITY_EXCELLENT = 1;
  CONNECTION_QUALITY_GOOD = 2;
  CONNECTION_QUALITY_FAIR = 3;
  CONNECTION_QUALITY_POOR = 4;
}

// QualityLevel defines video quality presets
enum QualityLevel {
  QUALITY_LEVEL_UNSPECIFIED = 0;
  QUALITY_LEVEL_LOW = 1;      // 360p
  QUALITY_LEVEL_MEDIUM = 2;   // 720p
  QUALITY_LEVEL_HIGH = 3;     // 1080p
  QUALITY_LEVEL_ULTRA = 4;    // 4K
}

// ErrorCode defines error types
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INTERNAL = 1;
  ERROR_CODE_INVALID_REQUEST = 2;
  ERROR_CODE_UNAUTHORIZED = 3;
  ERROR_CODE_FORBIDDEN = 4;
  ERROR_CODE_NOT_FOUND = 5;
  ERROR_CODE_CONFLICT = 6;
  ERROR_CODE_ROOM_FULL = 7;
  ERROR_CODE_TRACK_NOT_FOUND = 8;
  ERROR_CODE_PARTICIPANT_NOT_FOUND = 9;
  ERROR_CODE_NETWORK_ERROR = 10;
}

// Error message
message Error {
  ErrorCode code = 1;
  string message = 2;
  map<string, string> details = 3;
}

// Timestamp wrapper
message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}
